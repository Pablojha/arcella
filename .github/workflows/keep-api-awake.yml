# Render's free plan sleeps after 15 idle minutes and takes 30-60 seconds to wake.
# Pinging every 10 minutes from 06:30 to 01:30 IST (01:00-19:59 UTC) keeps it answering instantly through the day
# while using about 600 of the workspace's 750 free hours a month, so another free service still fits.
name: Keep API awake

on:
  schedule:
    - cron: '*/10 1-19 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the API health check
        env:
          API_URL: ${{ vars.API_URL }}
        run: curl --silent --show-error --max-time 120 "${API_URL:-https://arcella-api-pablojha.onrender.com}/api/health" || true
