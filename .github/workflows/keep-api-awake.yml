# Render's free plan sleeps after 15 idle minutes and takes 30-60 seconds to wake.
# Pinging every 10 minutes keeps the API answering instantly (one service fits in the free 750 hours/month).
name: Keep API awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the API health check
        env:
          API_URL: ${{ vars.API_URL }}
        run: curl --silent --show-error --max-time 120 "${API_URL:-https://arcella-api-pablojha.onrender.com}/api/health" || true
